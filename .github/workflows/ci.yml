name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Engine tests (swift test)
    # Camera Bridge builds with Xcode 27 (macOS 27 SDK) and runs on macOS 15 and later. Use a hosted runner image that has them, or a self-hosted macOS 27 runner.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: swift test
        working-directory: Packages/CameraBridgeKit
        run: |
          # The engine and its tests use Swift 6.4 features (Xcode 27); hosted macOS runners with Xcode 27 are not available yet.
          minor="$(swift --version | sed -nE 's/.*Swift version 6\.([0-9]+).*/\1/p' | head -1)"
          if [ "${minor:-0}" -lt 4 ]; then
            echo "::notice::The engine needs Swift 6.4 (Xcode 27); this runner has Swift 6.${minor:-?}, so nothing was built here. Run swift test locally."
            exit 0
          fi
          # A few timing tests can fail on a loaded shared runner; one retry of the whole run, never more.
          swift test || { echo "Retrying once"; swift test; }

  linux:
    name: Linux (${{ matrix.arch }}, swift test)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Swift 6.4: the tests use `await` inside `defer`. The same image the local Tools/linux-test.sh uses.
    container:
      image: swift:6.4
      # CAP_NET_ADMIN lets the netlink monitor test add a dummy interface; without it that test does nothing.
      options: --cap-add NET_ADMIN
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libavahi-compat-libdnssd-dev iproute2 ffmpeg ca-certificates libcurl4-openssl-dev libxml2-dev
      - name: swift build
        working-directory: Packages/CameraBridgeKit
        run: swift build
      - name: swift test
        working-directory: Packages/CameraBridgeKit
        run: |
          # Many tests use real clocks. A 2-CPU hosted runner cannot run them in parallel (reproduced locally with
          # `CB_CPUS=2 sh Tools/linux-test.sh test`), so they run one at a time; one retry of the whole run, never more.
          swift test --no-parallel || { echo "Retrying once"; swift test --no-parallel; }

  app:
    name: App build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        id: xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1] }')"
          if [ "$major" -ge 27 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The app is built with the macOS 27 SDK (Xcode 27). This runner has Xcode $major, so the app build and tests are skipped here; run them locally."
          fi
      - name: Install XcodeGen
        if: steps.xcode.outputs.ok == 'true'
        run: brew install xcodegen
      - name: Generate the project
        if: steps.xcode.outputs.ok == 'true'
        run: xcodegen generate
      - name: xcodebuild build (no code signing)
        if: steps.xcode.outputs.ok == 'true'
        run: |
          xcodebuild -project CameraBridge.xcodeproj -scheme CameraBridge -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build
      - name: xcodebuild test (no code signing)
        if: steps.xcode.outputs.ok == 'true'
        run: |
          xcodebuild -project CameraBridge.xcodeproj -scheme CameraBridge -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO test
