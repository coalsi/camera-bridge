name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Action versions are pinned by commit SHA (as in os-image.yml), read from the GitHub API for the tags named in the comments.

jobs:
  package:
    name: Engine tests (macOS, swift test)
    # The engine package (Packages/CameraBridgeKit) on macOS, with the newest Xcode of the runner image. It needs Swift 6.4 (Xcode 27); on an
    # image whose newest Xcode is older the job builds nothing and says so in a warning on the run (it does not fail: the Linux jobs test it).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: swift test
        working-directory: Packages/CameraBridgeKit
        run: |
          # The engine and its tests use Swift 6.4 features (Xcode 27).
          version="$(swift --version 2>/dev/null | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)"
          major="${version%%.*}" minor="${version#*.}"
          if [ -z "$version" ] || [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 4 ]; }; then
            echo "::warning title=Engine tests not run on macOS::The engine needs Swift 6.4 (Xcode 27); this runner's newest Xcode has Swift ${version:-unknown}, so nothing was built or tested on macOS. The Linux jobs ran the tests; run swift test on a Mac with Xcode 27."
            exit 0
          fi
          # A few timing tests can fail on a loaded shared runner; one retry of the whole run, never more.
          swift test || { echo "Retrying once"; swift test; }

  linux:
    name: Linux (${{ matrix.arch }}, swift test)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Swift 6.4.0 on Ubuntu 24.04, the image the release build compiles the daemon with (linux/os/build.sh, SWIFT_IMAGE), so CI tests the
    # compiler that ships (the tests use `await` inside `defer`). Tools/linux-test.sh takes another image with CB_SWIFT_IMAGE.
    container:
      image: swift:6.4.0-noble
      # CAP_NET_ADMIN lets the netlink monitor test add a dummy interface; without it that test does nothing.
      options: --cap-add NET_ADMIN
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libavahi-compat-libdnssd-dev iproute2 ffmpeg ca-certificates libcurl4-openssl-dev libxml2-dev
      - name: swift build
        working-directory: Packages/CameraBridgeKit
        run: swift build
      - name: swift test
        working-directory: Packages/CameraBridgeKit
        run: |
          # Many tests use real clocks. A 2-CPU hosted runner cannot run them in parallel (reproduced locally with
          # `CB_CPUS=2 sh Tools/linux-test.sh test`), so they run one at a time; one retry of the whole run, never more.
          swift test --no-parallel || { echo "Retrying once"; swift test --no-parallel; }

  web:
    name: Web page tests (linux/web-tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false   # no npm packages: the tests run on Node alone
      - name: Install ffmpeg (run.sh makes the fixture clips with it; the tests that need them would skip without it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: sh linux/web-tests/run.sh (the page's tests and its house rules)
        run: sh linux/web-tests/run.sh

  os-static:
    name: OS
    uses: ./.github/workflows/os-static.yml
