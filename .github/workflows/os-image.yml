name: Camera Bridge OS image

# Builds the Camera Bridge OS disk image (Debian 13, mkosi) and, for tags os-v*, publishes it as a GitHub Release.
# Tag os-v0.1 -> version 0.1 -> camera-bridge-os-0.1-amd64.img.xz. (The Mac app uses v* tags; the two never mix.)
#
# Until 1.0 the OS is one product in public beta, "Camera Bridge OS beta". Every beta still gets its own build number and tag
# (os-v0.1.109, os-v0.1.110, ...): boxes need it to see an update, and signatures and bug reports name it. At most one beta a day:
# gather the day's changes into one tag. After a beta is published and checked, the release job removes older betas from GitHub
# Releases and keeps the newest two (linux/os/prune-betas.sh); their git tags stay, and each one's package list and source offer are
# first copied to the release os-sources (the source offer in every image promises them for three years). It only lists what it
# would remove until the repository variable PRUNE_OS_BETAS is "on" (Settings > Secrets and variables > Actions > Variables). From
# 1.0 on (no leading "0."), releases are normal numbered full releases, are never removed, and the newest is GitHub's "Latest" (the Mac
# app's v* releases, which held "Latest", are archived pre-releases since 2026-10-18).
#
# Needed once, as repository secrets (see docs/linux/BUILDING.md, "Release signing"):
#   MINISIGN_SECRET_KEY   content of the minisign secret key file (create it without a password, or also set the next one)
#   MINISIGN_PASSWORD     only if the key has a password
# and the matching PUBLIC key committed at linux/os/mkosi.extra/usr/share/camera-bridge/update-key.pub.
# Without them a tag build fails on purpose: an image that cannot verify its own updates must not be released.
#
# Action versions are pinned by commit SHA. The SHAs were read from the GitHub API for the tags named in the comments.
# Everything else (docker, mkosi, Swift, Go, QEMU) runs inside containers/apt packages from Debian, the swift.org image and the
# official golang image (pinned by digest in linux/os/fetch-go2rtc.sh, which builds the go2rtc helper inside build.sh), and our
# own helpers built by linux/os/build-helpers.sh inside build.sh: wyze-lake (golang image pinned by digest) and eufy-bridge (node
# image pinned by digest; Node.js and the npm packages are checked against pinned SHA-256s and package-lock.json).

on:
  push:
    tags: ['os-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version for a manual build (digits and dots, e.g. 0.2)'
        required: true
        default: '0.0'
      stub_daemon:
        description: 'Use the stub daemon instead of building camerabridged (OS-only test build, never released)'
        type: boolean
        default: false
      smoke_tests:
        description: 'Tests of the QEMU boot test, comma separated (empty: all of them; see linux/os/test-vm.sh --help)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: os-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck, nft -c, systemd-analyze verify, repart, mkosi summary
        run: linux/os/test-static.sh
      - name: Self-test of the NVR test client (linux/os/test-nvr.py)
        run: python3 -I linux/os/test-nvr.py selftest
      - name: Self-test of the beta clean-up (linux/os/prune-betas.sh)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck; }
          shellcheck linux/os/prune-betas.sh linux/os/test-prune-betas.sh
          bash linux/os/test-prune-betas.sh
      - name: Self-test of the internet guard (linux/os/test-guard.sh, cb-guard against recorded dnsmasq lines)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck; }
          shellcheck -x linux/os/test-guard.sh linux/os/mkosi.extra/usr/sbin/cb-guard
          bash linux/os/test-guard.sh

  build:
    name: Build image (amd64)
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Work out the version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="${REF_NAME#os-v}"; else version="$INPUT_VERSION"; fi
          if ! [[ $version =~ ^[0-9]+(\.[0-9]+)*$ ]]; then echo "::error::bad version '$version'"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Make room on the runner
        # The image (with the Wi-Fi firmware) and its build need more than the runner's free disk: drop the preinstalled toolchains this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1
      - name: Build (camerabridged with Swift, go2rtc and wyze-lake with Go, eufy-bridge with Node, image with mkosi)
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          STUB: ${{ github.event.inputs.stub_daemon }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          flags=()
          if [ "$REF_TYPE" = tag ]; then flags+=(--release); fi
          if [ "$STUB" = true ]; then flags+=(--stub-daemon); fi
          linux/os/build.sh --version "$VERSION" --arch amd64 --out "$PWD/out" "${flags[@]}"
      - name: Show what was built
        run: ls -la out && cat out/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: camera-bridge-os-${{ steps.v.outputs.version }}-amd64
          path: out/
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Boot test in QEMU
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: camera-bridge-os-${{ needs.build.outputs.version }}-amd64
          path: out
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'   # linux/web-dev/conformance.mjs (the nvr test runs it against the box)
      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf openssh-client xz-utils curl
      - name: Enable KVM if the runner offers it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then echo "KVM available"; else echo "::warning::no /dev/kvm on this runner; the boot test runs in slow emulation and is limited to the basic tests"; fi
      - name: Boot the image and check it
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SMOKE_TESTS: ${{ github.event.inputs.smoke_tests }}
        run: |
          # daemon, nvr, nvr-archive and nvr-faults skip themselves on an image with the stub daemon.
          tests=${SMOKE_TESTS:-boot,ssh-off,system,persist,daemon,nvr,nvr-archive,nvr-faults,requests,factory-reset,installer,install-boot}
          case $tests in *[!a-z,-]*) echo "::error::the test list may only hold letters, commas and hyphens"; exit 1 ;; esac
          if [ ! -w /dev/kvm ]; then tests=boot,ssh-off; fi
          cpus=$(nproc); if [ "$cpus" -gt 4 ]; then cpus=4; fi
          linux/os/test-vm.sh --image "out/camera-bridge-os-$VERSION-amd64.img.xz" --arch amd64 --tests "$tests" --disk-size 32G --cpus "$cpus" \
              --work "$RUNNER_TEMP/vm" --keep
      - name: Serial log on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/vm/serial.log" || true
      - name: Keep the VM logs of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-logs-${{ needs.build.outputs.version }}
          path: |
            ${{ runner.temp }}/vm/serial.log
            ${{ runner.temp }}/vm/qemu.log
            ${{ runner.temp }}/vm/nvr/diag/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The notes, the public key the boxes check updates with, and the beta clean-up.
          sparse-checkout: |
            linux/web/js/release-notes.js
            linux/os/mkosi.extra/usr/share/camera-bridge/update-key.pub
            linux/os/prune-betas.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: camera-bridge-os-${{ needs.build.outputs.version }}-amd64
          path: out
      - name: Check the signatures once more before publishing
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          key="$GITHUB_WORKSPACE/linux/os/mkosi.extra/usr/share/camera-bridge/update-key.pub"
          cd out
          sha256sum -c SHA256SUMS
          test -s SHA256SUMS.sig && test -s "camera-bridge-os-$VERSION-amd64.img.xz.sig"
          # With the key that ships in the image, as a box checks an update.
          minisign -V -q -p "$key" -m SHA256SUMS -x SHA256SUMS.sig
          minisign -V -q -p "$key" -m "camera-bridge-os-$VERSION-amd64.img.xz" -x "camera-bridge-os-$VERSION-amd64.img.xz.sig"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRUNE_OS_BETAS: ${{ vars.PRUNE_OS_BETAS }}
        run: |
          # Versions before 1.0 are betas, published as pre-releases: a box on a beta takes the next one (cb-update's beta channel), a box on
          # 1.0 or later only full releases. A beta is one product, "Camera Bridge OS beta"; the version is its build number.
          PRERELEASE=()
          TITLE="Camera Bridge OS $VERSION"
          FIRST_LINE="Camera Bridge OS $VERSION (amd64)."
          WARNING=""
          case "$VERSION" in 0.*)
            PRERELEASE=(--prerelease)
            TITLE="Camera Bridge OS beta $VERSION"
            FIRST_LINE="Camera Bridge OS beta, build $VERSION (amd64)."
            WARNING="**Beta.** Camera Bridge OS runs every day on the reference box (Beelink Mini S, Intel N150, 12 GB) and passes automated tests on virtual machines, including install to a disk, updates and automatic rollback. The interface is still being refined before 1.0. Please report what you find in an issue."
            if [ "$PRUNE_OS_BETAS" = on ]; then
              WARNING="$WARNING Only the two newest beta builds are listed here. Older builds keep their git tags, and their package lists and source offers are kept in the release os-sources."
            fi
            ;;
          esac
          # What changed, from the notes the page's About shows (linux/web/js/release-notes.js), when they have this version.
          CHANGES=$(node --input-type=module -e "
            const { notesFor } = await import('./linux/web/js/release-notes.js');
            const entry = notesFor(process.env.VERSION);
            if (entry) console.log('## ' + entry.title + '\n\n' + entry.items.map((item) => '- ' + item).join('\n'));
          " 2>/dev/null || true)
          cat > notes.md <<EOF
          $FIRST_LINE

          $WARNING

          $CHANGES

          Download \`camera-bridge-os-$VERSION-amd64.img.xz\`, check it against \`.sha256\`, and write it to a USB stick or SSD with balenaEtcher.
          Licenses and source code: \`SOURCE-OFFER.txt\` and \`camera-bridge-os-$VERSION-packages.txt\` (the exact packages), and docs/linux/LICENSES.md.
          Guide: docs/linux/USER-GUIDE.md. Updates inside the running system use \`SHA256SUMS\`, \`SHA256SUMS.sig\` and the \`cb-os_*\` files.
          EOF
          FILES=(
            out/camera-bridge-os-"$VERSION"-amd64.img.xz
            out/camera-bridge-os-"$VERSION"-amd64.img.xz.sha256
            out/camera-bridge-os-"$VERSION"-amd64.img.xz.sig
            out/SHA256SUMS
            out/SHA256SUMS.sig
            out/camera-bridge-os-"$VERSION"-packages.txt
            out/SOURCE-OFFER.txt
            out/cb-os_"$VERSION"_amd64.efi
            out/cb-os_"$VERSION"_amd64_root.raw.zst
          )
          printf '%s\n' "${FILES[@]#out/}" > release-files.txt   # the next step checks each one on the published release
          # A beta is a pre-release, so it never becomes "Latest"; a full release such as os-v1.0 does (the Mac app, which held "Latest",
          # is archived since 2026-10-18).
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes-file notes.md \
            "${PRERELEASE[@]}" \
            "${FILES[@]}"
      - name: Check the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Older betas are removed only after this passes: the release is there and not a draft, a beta is a pre-release, every file is on
          # it with the size it has here, and the signed list on the release is ours and verifies with the key the boxes use.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets > published.json
          beta=false; case "$VERSION" in 0.*) beta=true ;; esac
          jq -e --arg tag "$TAG" --argjson beta "$beta" '.tagName == $tag and .isDraft == false and .isPrerelease == $beta' published.json >/dev/null \
            || { echo "::error::$TAG is not published as expected"; jq '{tagName, isDraft, isPrerelease}' published.json; exit 1; }
          while IFS= read -r name; do
            size=$(jq -r --arg n "$name" '[.assets[] | select(.name == $n) | .size][0] // "missing"' published.json)
            here=$(stat -c %s "out/$name")
            [ "$size" = "$here" ] || { echo "::error::$name on the release: $size bytes; built: $here bytes"; exit 1; }
          done < release-files.txt
          mkdir -p published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published --pattern SHA256SUMS --pattern SHA256SUMS.sig
          cmp published/SHA256SUMS out/SHA256SUMS
          minisign -V -q -p linux/os/mkosi.extra/usr/share/camera-bridge/update-key.pub -m published/SHA256SUMS -x published/SHA256SUMS.sig
          echo "$TAG is published with its $(wc -l < release-files.txt) files and a good signature."
      - name: Remove older betas (the newest two stay, git tags stay; only listed until PRUNE_OS_BETAS is on)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          KEEP: '2'
          PRUNE_OS_BETAS: ${{ vars.PRUNE_OS_BETAS }}
        run: |
          # Only os-v0.x pre-releases are removed, never the one just published, never a Mac (v*) or full release. Each one's package list
          # and source offer are copied to the release os-sources and checked there first. The release is published and checked by now,
          # so a failure here only leaves extra betas listed: it is logged, not fatal. Until the repository variable PRUNE_OS_BETAS is
          # "on" this is a dry run. By hand, from a checkout: linux/os/prune-betas.sh --repo OWNER/NAME --dry-run.
          mode=(--dry-run)
          if [ "$PRUNE_OS_BETAS" = on ]; then mode=(); else
            echo "::notice::Dry run: older betas are listed, not removed. Set the repository variable PRUNE_OS_BETAS to on to remove them."
          fi
          if ! bash linux/os/prune-betas.sh --repo "$GITHUB_REPOSITORY" --except "$TAG" "${mode[@]}"; then
            echo "::warning::Older betas were not removed (see the log above). The release itself is published."
          fi
