<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Camera Bridge (small sizes)</title>
  <!-- Simplified variant of CameraBridgeLogo.svg for 64 px and below: thicker cable and deck, solid towers without crossbeams,
       five suspenders, no glint, no hairline details. -->
  <defs>
    <clipPath id="lens"><circle cx="100" cy="100" r="72"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="94" fill="#9E2B20"/>
  <circle cx="100" cy="100" r="74" fill="#151517"/>
  <g clip-path="url(#lens)" fill="none" stroke="#EFE6D8" stroke-linecap="butt">
    <path d="M67,46 Q100,166 133,46" stroke-width="8"/>
    <path d="M67,46 Q48,98 20,126" stroke-width="8"/>
    <path d="M133,46 Q152,98 180,126" stroke-width="8"/>
    <g stroke-width="4.5">
      <line x1="80" y1="84" x2="80" y2="124"/><line x1="90" y1="100" x2="90" y2="124"/><line x1="100" y1="106" x2="100" y2="124"/>
      <line x1="110" y1="100" x2="110" y2="124"/><line x1="120" y1="84" x2="120" y2="124"/>
    </g>
  </g>
  <g clip-path="url(#lens)" fill="#EFE6D8">
    <rect x="20" y="120" width="160" height="14"/>
    <rect x="59" y="38" width="16" height="120" rx="2"/>
    <rect x="125" y="38" width="16" height="120" rx="2"/>
  </g>
  <circle cx="100" cy="100" r="74" fill="none" stroke="#6E1A14" stroke-width="5"/>
</svg>
