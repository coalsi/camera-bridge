# Camera Bridge OS: mkosi configuration (Debian 13 "trixie", minimal, UEFI + systemd-boot, A/B root).
# Build it with linux/os/build.sh, which renders mkosi.repart from ../repart, stages the daemon and the web UI,
# and passes the image version. See docs/linux/BUILDING.md.

[Distribution]
Distribution=debian
Release=trixie
# non-free-firmware carries the Intel GuC/HuC firmware (hardware H.264 encode on N100/N150) and Realtek NIC firmware.
Repositories=main,non-free-firmware

[Output]
Format=disk
ImageId=camera-bridge-os
Output=camera-bridge-os
# The image is compressed by build.sh (xz), the update artifacts by zstd.
CompressOutput=no
ManifestFormat=json
# uki: the unified kernel image (an update artifact). partitions: one file per partition (root A is an update artifact).
SplitArtifacts=uki,partitions
# build.sh passes --image-version (the os-v tag without "os-v"), --repart-directory and --extra-tree.

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
# Boot counting: /etc/kernel/tries (in mkosi.extra) makes mkosi name the UKI cb-os_<version>+3.efi, so systemd-boot
# counts boot attempts and systemd-bless-boot marks the entry good once boot-complete.target is reached.
UnifiedKernelImageFormat=cb-os_%v+&c
# The root filesystem is found by partition label: sysupdate labels the slot it writes "cb-root_<version>", and the
# UKI of that version names that label. Read-only root, volatile /var (see mkosi.extra/etc/fstab).
KernelCommandLine=root=PARTLABEL=cb-root_%v
                  ro
                  rootfstype=ext4
                  panic=10
                  loglevel=4
                  systemd.show_status=auto
                  audit=0
                  usbcore.autosuspend=-1
Hostname=camera-bridge
Locale=C.UTF-8
Timezone=UTC
Keymap=us
RootShell=/bin/bash
# No root password: the account is locked (see mkosi.postinst.chroot). Console login is off; SSH is key-only and opt-in.
WithDocs=no
CleanPackageMetadata=yes
RemoveFiles=/usr/share/man
            /usr/share/info
            /usr/share/lintian
            /usr/share/bug
            /usr/share/locale
            /usr/share/doc/*/changelog*
# The tiny extra tree: units, scripts, config. The daemon and the web UI are added by build.sh as a second tree.
ExtraTrees=mkosi.extra

Packages=
    systemd
    systemd-sysv
    systemd-resolved
    systemd-boot
    systemd-boot-efi
    systemd-ukify
    systemd-repart
    # provides systemd-sysupdate (A/B updates) in Debian
    systemd-container
    systemd-zram-generator
    udev
    dbus
    dbus-daemon
    kmod
    avahi-daemon
    libavahi-compat-libdnssd1
    ffmpeg
    vainfo
    mesa-va-drivers
    nftables
    chrony
    openssh-server
    ca-certificates
    curl
    jq
    minisign
    zstd
    xz-utils
    iproute2
    iputils-ping
    util-linux
    e2fsprogs
    dosfstools
    fdisk
    openssl
    # Runtime libraries of a statically linked Swift stdlib build (Foundation still needs these).
    libcurl4t64
    libxml2
    libstdc++6
    libgcc-s1
    tzdata
    # firmware: Intel GuC/HuC (VA-API low-power H.264 encode), Realtek 2.5G/1G NICs common in mini PCs
    firmware-intel-graphics
    firmware-realtek

[Build]
# Keep downloaded packages between builds (an incremental image cache is kept by build.sh in a docker volume).
WithNetwork=yes
