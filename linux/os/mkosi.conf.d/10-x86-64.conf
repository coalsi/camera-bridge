[Match]
Architecture=x86-64

[Content]
# Serial console on ttyS0 helps headless boxes and the QEMU smoke test; the video console stays the primary one.
KernelCommandLine=console=ttyS0,115200
                  console=tty0
Packages=
    linux-image-amd64
    # Free Intel media driver (VA-API) for Gen8+ iGPUs incl. N100/N150 (Alder Lake-N); needs the HuC firmware for low-power H.264 encode.
    intel-media-va-driver
