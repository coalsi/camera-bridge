# Camera Bridge OS: NetworkManager runs Wi-Fi only (joining a network, and the setup hotspot); wired Ethernet is systemd-networkd's
# (/etc/systemd/network/10-ethernet.network). Saved networks live on the data partition, so they survive updates.
[main]
plugins=keyfile
dns=systemd-resolved

[keyfile]
path=/srv/system/network-connections
unmanaged-devices=except:type:wifi

[device]
wifi.scan-rand-mac-address=no

[connectivity]
enabled=false
