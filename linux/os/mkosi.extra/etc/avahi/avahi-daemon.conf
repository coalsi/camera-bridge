# Camera Bridge OS: avahi publishes camera-bridge.local and carries the HomeKit (_hap._tcp) advertisements of the engine
# (libavahi-compat-libdnssd provides the dns_sd API on top of this daemon).
[server]
# host-name is left unset: avahi uses the system hostname (camera-bridge). If another Camera Bridge box already uses it, avahi picks camera-bridge-2.
use-ipv4=yes
use-ipv6=yes
check-response-ttl=no
use-iff-running=no
enable-dbus=yes
disallow-other-stacks=no
allow-point-to-point=no
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
disable-publishing=no
disable-user-service-publishing=no
add-service-cookie=no
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=yes
publish-resolv-conf-dns-servers=no
publish-aaaa-on-ipv4=yes
publish-a-on-ipv6=no

[reflector]
enable-reflector=no
reflect-ipv=no

[rlimits]
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=768
rlimit-stack=4194304
rlimit-nproc=3
