# Camera Bridge OS time sync. HomeKit and TLS need a correct clock; many mini PCs lose theirs when unplugged.
pool 2.debian.pool.ntp.org iburst
# Step the clock whenever it is more than a second off (boot with a dead RTC battery); never wait for a "safe" moment.
makestep 1.0 -1
rtcsync
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
ntsdumpdir /var/lib/chrony

# The box is also the cameras' time server ("Set up for Camera Bridge" points them at it), so every camera and the bridge agree
# without the internet. Only local and private networks are answered (the firewall lets UDP 123 in from those only, too); the
# command port stays on localhost.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
allow 169.254.0.0/16
allow fc00::/7
allow fe80::/10
# Without the internet the box still answers, from its own clock (the N150's RTC drifts slowly): good enough for the cameras to agree
# with the bridge and with each other, which is what recordings and events need. Stratum 10 so any real server is preferred.
local stratum 10
