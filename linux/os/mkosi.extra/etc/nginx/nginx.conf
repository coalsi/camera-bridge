# Camera Bridge OS: the TLS front of the secure address (docs/superpowers/specs/2026-10-22-https-certificate-design.md).
# It listens on 443 and hands everything to the daemon on 127.0.0.1:80, which has no TLS of its own. It starts only when a certificate exists
# (nginx.service.d/10-camera-bridge.conf). Nothing is buffered, so server-sent events and long video answers flow as they are made, and the
# daemon sees every request body as it arrives (the daemon sets the size limits).
user www-data;
worker_processes 2;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    # Each client's own cap (the daemon sees every https client as loopback): the same 128 as its per-address limit.
    limit_conn_zone $binary_remote_addr zone=perclient:1m;
    access_log off;
    server_tokens off;
    gzip off;
    sendfile off;
    # Nothing is ever written to disk for a request (buffering is off); these keep nginx off the read-only root.
    client_body_temp_path /run/nginx-tls/body;
    proxy_temp_path /run/nginx-tls/proxy;
    fastcgi_temp_path /run/nginx-tls/fastcgi;
    uwsgi_temp_path /run/nginx-tls/uwsgi;
    scgi_temp_path /run/nginx-tls/scgi;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cbtls:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    server {
        limit_conn perclient 128;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /srv/system/tls/fullchain.pem;
        ssl_certificate_key /srv/system/tls/privkey.pem;

        client_max_body_size 0;
        proxy_request_buffering off;

        location / {
            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            # The daemon trusts these two only from a loopback peer (SecureAddressRules.normalized); they are set here, never passed on.
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
        }
    }
}
