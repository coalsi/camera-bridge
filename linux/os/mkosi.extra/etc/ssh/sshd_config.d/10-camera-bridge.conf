# SSH is off until it is enabled in the web UI (Settings > System) or with `cb-system ssh-enable`.
# When it is on: key login only (no passwords), root only, keys and host keys live on the data partition.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile /srv/system/ssh/authorized_keys
HostKey /srv/system/ssh/ssh_host_ed25519_key
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitUserEnvironment no
ClientAliveInterval 60
ClientAliveCountMax 3
