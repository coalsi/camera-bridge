# Camera Bridge OS kernel settings.

# The engine receives and sends many UDP packets (RTP from cameras, SRTP to the Home hub): bigger socket buffers
# and queues avoid drops during bursts.
net.core.rmem_default = 1048576
net.core.rmem_max = 8388608
net.core.wmem_default = 1048576
net.core.wmem_max = 8388608
net.core.netdev_max_backlog = 5000
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.tcp_rmem = 4096 131072 8388608
net.ipv4.tcp_wmem = 4096 65536 8388608

# This is a host, not a router.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1

# Small, slow media (USB sticks): flush dirty pages in small steps so a write burst cannot stall the box for seconds.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
vm.dirty_expire_centisecs = 1500
# Swap is zram (compressed RAM), so prefer it over dropping page cache.
vm.swappiness = 100
vm.page-cluster = 0

# A kernel panic reboots after 10 s instead of hanging; no magic SysRq on a headless box.
kernel.panic = 10
kernel.sysrq = 0
kernel.kptr_restrict = 1
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
