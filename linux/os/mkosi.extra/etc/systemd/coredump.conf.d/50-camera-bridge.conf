# Camera Bridge OS: when a program crashes, never keep its memory image. A memory image of the bridge would hold camera passwords and
# keys. systemd-coredump only logs that it crashed (the image has no libdw, so it writes no stack trace); the daemon's own Swift backtrace,
# function names without memory contents, goes to the journal (SWIFT_BACKTRACE in camerabridged.service).
[Coredump]
Storage=none
ProcessSizeMax=2G
