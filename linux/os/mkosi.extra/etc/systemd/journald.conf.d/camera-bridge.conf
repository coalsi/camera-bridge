# An SSD of 256 GB or more (the minimum since 2026-10-14): a month of journal for diagnosing, synced every minute, compressed.
# The journal lives on the data partition (/var/log/journal is bound to /srv/journal), at most 1 GB there.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemKeepFree=1G
SystemMaxFileSize=64M
RuntimeMaxUse=128M
MaxRetentionSec=1month
MaxFileSec=1day
SyncIntervalSec=1min
RateLimitIntervalSec=30s
RateLimitBurst=5000
Compress=yes
ForwardToSyslog=no
ForwardToWall=no
