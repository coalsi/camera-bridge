# Small media: keep the journal small, sync rarely (fewer writes to a USB stick), and compress.
# The journal lives on the data partition (/var/log/journal is bound to /srv/journal), at most 200 MB there.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=500M
SystemMaxFileSize=20M
RuntimeMaxUse=50M
MaxRetentionSec=2week
MaxFileSec=1day
SyncIntervalSec=5min
RateLimitIntervalSec=30s
RateLimitBurst=5000
Compress=yes
ForwardToSyslog=no
ForwardToWall=no
