# Run by systemd-repart.service on every boot. Existing partitions are matched by type and are not touched unless a
# definition can grow them: on the first boot the data partition (below) grows to fill the stick or SSD, and a missing
# root B slot or data partition is created if the device is large enough.
[Partition]
Type=esp
Label=cb-esp
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=512M
