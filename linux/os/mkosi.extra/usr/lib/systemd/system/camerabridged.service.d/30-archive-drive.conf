[Unit]
# The archive drive (or its placeholder) is in place before the engine starts, so its first catalog load scans it. Only wanted: the engine runs
# without it (and finds it when it is plugged in later; it writes there only while the drive's marker is in the folder). The folder is inside the
# unit's ReadWritePaths (/var/lib/camera-bridge), and mounts made there later reach the engine's namespace.
After=camera-bridge-archive-drive.service
Wants=camera-bridge-archive-drive.service
