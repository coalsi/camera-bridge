# The TLS front runs only when the secure address has a certificate; cb-tls restarts it when a new one is installed.
[Unit]
After=camera-bridge-tls.service
Wants=camera-bridge-tls.service
ConditionPathExists=/srv/system/tls/fullchain.pem
ConditionPathExists=/srv/system/tls/privkey.pem
RequiresMountsFor=/srv

[Service]
RuntimeDirectory=nginx-tls
