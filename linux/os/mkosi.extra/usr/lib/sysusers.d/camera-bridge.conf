# Fixed IDs: the data partition survives updates and re-installs, so the owner of its files must never change.
g camerabridge 931
u camerabridge 931:931 "Camera Bridge daemon" /var/lib/camera-bridge /usr/sbin/nologin
m camerabridge video
m camerabridge render
# Fetches update files from GitHub; owns nothing but its download cache and can write nowhere else.
g cbupdate 932
u cbupdate 932:932 "Camera Bridge update download" /nonexistent /usr/sbin/nologin
