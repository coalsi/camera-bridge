# /var is a tmpfs: recreate what services expect, every boot.
d /run/camera-bridge           0755 root root -
# The daemon drops request files here (reboot, update, enable SSH, ...); camera-bridge-request.path wakes the root helper.
d /run/camera-bridge/requests  0770 root camerabridge -
# Root-written status files that the daemon (and so the web UI) reads: update state, installer progress, SSH state.
d /run/camera-bridge/status    0755 root root -
d /run/camera-bridge/jobs      0700 root root -
d /var/lib/chrony              0750 _chrony _chrony -
d /var/log/chrony              0750 _chrony _chrony -
d /var/tmp                     1777 root root -
