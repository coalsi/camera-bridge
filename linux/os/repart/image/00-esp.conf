# Used only while building the disk image (build.sh renders @VERSION@ into 10-root-a.conf and gives mkosi this folder).
[Partition]
Type=esp
Label=cb-esp
Format=vfat
CopyFiles=/efi:/
# The UKI is written to /boot/EFI/Linux by the kernel install hooks; only EFI/ belongs on the ESP (not vmlinuz, System.map).
CopyFiles=/boot/EFI:/EFI
SizeMinBytes=512M
SizeMaxBytes=512M
