# Root slot A: the running system as built. The label carries the version; the UKI of this version names it
# (root=PARTLABEL=cb-root_<version>), and systemd-sysupdate matches slots by this label.
[Partition]
Type=root
Label=cb-root_@VERSION@
Format=ext4
SplitName=root
CopyFiles=/
SizeMinBytes=@ROOT_SIZE@
SizeMaxBytes=@ROOT_SIZE@
