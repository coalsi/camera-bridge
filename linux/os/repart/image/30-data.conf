# Data partition: config, HomeKit pairings, secrets, logs, update staging. Updates never touch it.
# Type "srv": systemd-gpt-auto-generator mounts the srv partition of the booted disk at /srv (never a data partition
# of another disk that happens to have the same label), growing the file system on mount.
[Partition]
Type=srv
Label=cb-data
Format=ext4
GrowFileSystem=yes
MakeDirectories=/camera-bridge /system /update
SizeMinBytes=512M
Weight=1000
