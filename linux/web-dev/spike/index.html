<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>MSE spike S1</title>
  <link rel="stylesheet" href="/spike.css">
  <script type="module" src="/spike.js"></script>
</head>
<body>
  <main>
    <h1>MSE spike S1 <small id="build"></small></h1>
    <p id="intro">Plays recorded fragments through MediaSource over plain HTTP and reports what the browser does. Keep this tab in front and the screen awake until it says finished.</p>
    <div class="bar">
      <button id="run-all" type="button">Run all</button>
      <button id="send" type="button">Send results</button>
      <a id="download" download="results.json">Download JSON</a>
      <span id="status" role="status"></span>
    </div>
    <h2>This browser</h2>
    <table id="env"></table>
    <h2>Cases</h2>
    <ol id="cases"></ol>
    <h2>Log</h2>
    <pre id="log"></pre>
  </main>
  <div id="stagebox" aria-label="video stage">
    <video id="stage" muted playsinline></video>
    <div id="tiles"></div>
  </div>
  <noscript><p>This page needs JavaScript.</p></noscript>
</body>
</html>
